<!-- templates/edit.html -->
{% extends "base.html" %}

{% block content %}

    <h2>Edit Expense</h2>

    <form action="/edit/{{ expense.id }}" method="POST">
        <input type="text" name="title" value="{{ form_data.title }}">
        <input type="text" name="amount" value="{{ form_data.amount }}">
        <select name="category">
            {% for c in categories %}
                <option value="{{ c }}" {% if c == form_data.category %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
        <button type="submit">Update</button>
    </form>

    <p><a href="/">&larr; Kembali</a></p>

{% endblock %}
