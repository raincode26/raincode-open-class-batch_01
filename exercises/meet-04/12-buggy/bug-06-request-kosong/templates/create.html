<!-- templates/create.html -->
{% extends "base.html" %}

{% block content %}

    <h2>Tambah Expense</h2>

    <form action="/create" method="POST">
        <input type="text" name="judul" placeholder="Title" value="{{ form_data.get('title', '') }}">
        <input type="text" name="amount" placeholder="Amount" value="{{ form_data.get('amount', '') }}">
        <select name="category">
            {% for c in categories %}
                <option value="{{ c }}" {% if c == form_data.get('category') %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
        <button type="submit">Simpan</button>
    </form>

    <p><a href="/">&larr; Kembali</a></p>

{% endblock %}
