<!-- Topik: Create Table -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>
<body>

    <h1>Expense Tracker</h1>
    <h2>Daftar Pengeluaran</h2>

    <!-- Jinja if/else: tampilkan pesan berbeda tergantung ada/tidaknya
         data. Tabel baru dibuat di app.py, jadi wajar kalau masih
         kosong — ini BUKAN tanda ada yang salah. -->
    {% if data %}
        <ul>
        {% for t in data %}
            <li>{{ t.nama }} — Rp {{ t.nominal }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Belum ada transaksi. Tabel sudah siap — tinggal diisi di
           07-create-expense!</p>
    {% endif %}

</body>
</html>
