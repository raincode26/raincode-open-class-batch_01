<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>
<body>

    <h1>Expense Tracker</h1>

    <h2>Tambah Pengeluaran</h2>
    <form action="/tambah" method="POST">
        <input type="text" name="nama" placeholder="Nama pengeluaran" required>
        <input type="number" name="nominal" placeholder="Nominal" required>
        <button type="submit">Simpan</button>
    </form>

    <h2>Daftar Pengeluaran</h2>
    {% if data %}
        <ul>
        {% for t in data %}
            <!-- Tautan ini akan menampilkan detail satu transaksi
                 lewat route '/detail/<int:id>' yang kamu buat. -->
            <li><a href="/detail/{{ t.id }}">{{ t.nama }} — Rp {{ t.nominal }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Belum ada transaksi. Isi form di atas untuk mulai.</p>
    {% endif %}

</body>
</html>
