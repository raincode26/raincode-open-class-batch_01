<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Debugging</title>
</head>
<body>

    <h1>Contoh Debugging — print()</h1>
    <form action="/tambah" method="POST">
        <input type="text" name="nama" placeholder="Nama pengeluaran" required>
        <input type="number" name="nominal" placeholder="Nominal" required>
        <button type="submit">Simpan</button>
    </form>

    <ul>
    {% for t in data %}
        <li>{{ t.nama }} — Rp {{ t.nominal }}</li>
    {% endfor %}
    </ul>

    <p><em>Lihat terminal tempat kamu menjalankan "python contoh_debug.py" — bukan halaman ini — untuk melihat hasil print().</em></p>

</body>
</html>
