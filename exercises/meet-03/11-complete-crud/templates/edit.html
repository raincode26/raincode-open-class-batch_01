<!-- templates/edit.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Pengeluaran</title>
</head>
<body>

    <h1>Edit Pengeluaran</h1>

    {% if item %}
        <form action="/edit/{{ item.id }}" method="POST">
            <input type="text" name="nama" value="{{ item.nama }}" required>
            <input type="number" name="nominal" value="{{ item.nominal }}" required>
            <select name="kategori" required>
                <option value="Makanan" {% if item.kategori == 'Makanan' %}selected{% endif %}>Makanan</option>
                <option value="Transportasi" {% if item.kategori == 'Transportasi' %}selected{% endif %}>Transportasi</option>
                <option value="Belanja" {% if item.kategori == 'Belanja' %}selected{% endif %}>Belanja</option>
                <option value="Tagihan" {% if item.kategori == 'Tagihan' %}selected{% endif %}>Tagihan</option>
                <option value="Hiburan" {% if item.kategori == 'Hiburan' %}selected{% endif %}>Hiburan</option>
                <option value="Lainnya" {% if item.kategori == 'Lainnya' %}selected{% endif %}>Lainnya</option>
            </select>
            <input type="date" name="tanggal" value="{{ item.tanggal }}" required>
            <button type="submit">Simpan Perubahan</button>
        </form>
    {% else %}
        <p>Transaksi dengan id ini tidak ditemukan.</p>
    {% endif %}

    <br>
    <a href="/">&larr; Batal, kembali ke daftar</a>

</body>
</html>
