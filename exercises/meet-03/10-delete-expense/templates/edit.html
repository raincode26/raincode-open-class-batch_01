<!-- templates/edit.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Pengeluaran</title>
</head>
<body>

    <h1>Edit Pengeluaran</h1>

    {% if item %}
        <form action="/edit/{{ item.id }}" method="POST">
            <input type="text" name="nama" value="{{ item.nama }}" required>
            <input type="number" name="nominal" value="{{ item.nominal }}" required>
            <button type="submit">Simpan Perubahan</button>
        </form>
    {% else %}
        <p>Transaksi dengan id ini tidak ditemukan.</p>
    {% endif %}

    <br>
    <a href="/">&larr; Batal, kembali ke daftar</a>

</body>
</html>
