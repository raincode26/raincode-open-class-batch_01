<!-- Topik: Jinja — menampilkan data Python di HTML -->

<!-- ============================================================
     DUA TANDA KURUNG JINJA
     ============================================================
     {{ ... }}   -> MENAMPILKAN nilai (mis. {{ t.nama }})
     {% ... %}   -> LOGIKA: loop & kondisi (mis. {% for %} ... {% endfor %})

     Ingat pola HTML dari Pertemuan 2: tiap tag pembuka butuh
     penutup. Berlaku juga di sini — {% for %} butuh {% endfor %}.
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>
<body>

    <h1>Daftar Pengeluaran</h1>

    <!-- TODO 2: Tampilkan setiap item di "data" sebagai satu <li>,
         berformat: "<nama> — Rp <nominal>"

         Pola:
           <ul>
           {% for t in data %}
               <li>{{ t.nama }} — Rp {{ t.nominal }}</li>
           {% endfor %}
           </ul>

         Ingat: t.nama bisa dibaca lewat titik karena tiap "t" di
         sini adalah satu dict Python — {{ t.nama }} sama artinya
         dengan t['nama'] di Python biasa.
    -->
    <ul>
        <!-- Tulis kode Jinja kamu di sini -->
    </ul>

</body>
</html>
