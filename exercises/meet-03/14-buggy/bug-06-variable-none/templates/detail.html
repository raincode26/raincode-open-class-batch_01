<!-- templates/detail.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bug 6 - Variabel None</title>
</head>
<body>

    <h1>Detail Pengeluaran</h1>

    {% if item %}
        <p>ID: {{ item.id }}</p>
        <p>Nama: {{ item.nama }}</p>
        <p>Nominal: Rp {{ item.nominal }}</p>
    {% else %}
        <p>Transaksi dengan id ini tidak ditemukan.</p>
    {% endif %}

    <br>
    <a href="/tambah-contoh">Buat data contoh (id=1)</a>

</body>
</html>
