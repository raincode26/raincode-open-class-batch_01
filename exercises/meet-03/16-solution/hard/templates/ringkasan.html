<!-- templates/ringkasan.html -->
<!-- Solusi Challenge Hard — Ringkasan Harian + Total Pengeluaran -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Ringkasan Pengeluaran</title>
</head>
<body>

    <h1>Ringkasan Pengeluaran</h1>

    <h2>Total Keseluruhan: Rp {{ total }}</h2>

    <h3>Per Tanggal</h3>
    {% if per_tanggal %}
        <ul>
        {% for baris in per_tanggal %}
            <li>{{ baris.tanggal }} — Rp {{ baris.total_harian }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Belum ada transaksi untuk diringkas.</p>
    {% endif %}

    <br>
    <a href="/">&larr; Kembali ke daftar</a>

</body>
</html>
