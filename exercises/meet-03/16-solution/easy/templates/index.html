<!-- templates/index.html -->
<!-- Solusi Challenge Easy — Kategori Berwarna -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Expense Tracker</h1>

    <form action="/tambah" method="POST">
        <input type="text" name="nama" placeholder="Nama pengeluaran" required>
        <input type="number" name="nominal" placeholder="Nominal" required>
        <select name="kategori" required>
            <option value="Makanan">Makanan</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Belanja">Belanja</option>
            <option value="Tagihan">Tagihan</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Lainnya">Lainnya</option>
        </select>
        <input type="date" name="tanggal" required>
        <button type="submit">Simpan</button>
    </form>

    <h2>Daftar Pengeluaran</h2>
    <ul>
    {% for t in data %}
        <li>
            {{ t.nama }} — Rp {{ t.nominal }}
            <span class="kategori kategori-{{ t.kategori|lower }}">{{ t.kategori }}</span>
            &middot;
            <a href="/hapus/{{ t.id }}">Hapus</a>
        </li>
    {% endfor %}
    </ul>

</body>
</html>
