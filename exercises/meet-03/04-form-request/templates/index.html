<!-- templates/index.html -->
<!-- Topik: Form & Request -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>
<body>

    <h1>Expense Tracker</h1>

    <!-- ============================================================
         FORM TAMBAH TRANSAKSI
         ============================================================
         Dua atribut kunci di <form>:
           action="/tambah" -> alamat tujuan pengiriman data
           method="POST"    -> cara kirim (data disembunyikan di body,
                                cocok untuk kirim/simpan data)

         Atribut "name" di tiap <input> adalah KUNCI yang dibaca
         Python lewat request.form['nama-nya-di-sini']. Kalau name
         salah ketik, Python tidak akan menemukan datanya!
    -->
    <form action="/tambah" method="POST">
        <input type="text" name="nama" placeholder="Nama pengeluaran" required>
        <input type="number" name="nominal" placeholder="Nominal" required>
        <button type="submit">Simpan</button>
    </form>

    <h2>Daftar Pengeluaran</h2>
    <ul>
        {% for t in data %}
            <li>{{ t.nama }} — Rp {{ t.nominal }}</li>
        {% endfor %}
    </ul>

</body>
</html>
